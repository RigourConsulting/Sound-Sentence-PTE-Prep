<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

    <defs>
      <!-- Upper Ribbon Primary Glass Gradient -->
      <linearGradient id="upperGlassGrad" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#E8F1F5" stop-opacity="0.95" />
        <stop offset="45%" stop-color="#C9D9E4" stop-opacity="0.85" />
        <stop offset="85%" stop-color="#8BA5B5" stop-opacity="0.90" />
        <stop offset="100%" stop-color="#30253F" stop-opacity="0.40" />
      </linearGradient>

      <!-- Upper Ribbon Facet Highlight -->
      <linearGradient id="upperFacetGrad" x1="0" y1="0" x2="1" y2="0.7">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#C9D9E4" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#B2C7D5" stop-opacity="0.2" />
      </linearGradient>

      <!-- Lower Ribbon Primary Glass Gradient -->
      <linearGradient id="lowerGlassGrad" x1="0.8" y1="1" x2="0.2" y2="0">
        <stop offset="0%" stop-color="#D6E4ED" stop-opacity="0.95" />
        <stop offset="40%" stop-color="#B2C7D5" stop-opacity="0.85" />
        <stop offset="80%" stop-color="#6F889A" stop-opacity="0.90" />
        <stop offset="100%" stop-color="#30253F" stop-opacity="0.55" />
      </linearGradient>

      <!-- Lower Ribbon Facet Highlight -->
      <linearGradient id="lowerFacetGrad" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
        <stop offset="60%" stop-color="#C9D9E4" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#30253F" stop-opacity="0.1" />
      </linearGradient>

      <!-- Central Refractive Coral Seam -->
      <linearGradient id="coralSeamGrad" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
        <stop offset="0%" stop-color="#F08D7A" />
        <stop offset="45%" stop-color="#B94836" />
        <stop offset="100%" stop-color="#8F2D1F" />
      </linearGradient>

      <!-- Soft Internal Ambient Occlusion -->
      <filter id="glassRefract" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.19   0 0 0 0 0.15   0 0 0 0 0.25  0 0 0 0.25 0" />
        <feMerge>
          <feMergeNode />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    
    <g filter="url(#glassRefract)">
      <!-- UPPER RIBBON MAIN BODY -->
      <path d="M 345,115 C 235,100 165,150 165,225 C 165,280 215,305 275,320 L 260,285 C 220,270 195,250 195,220 C 195,175 240,140 330,150 Z"
            fill="url(#upperGlassGrad)" />

      <!-- UPPER RIBBON FACET ACCENT -->
      <path d="M 345,115 C 240,105 180,145 175,210 C 190,165 245,135 345,140 Z"
            fill="url(#upperFacetGrad)" />

      <!-- LOWER RIBBON MAIN BODY -->
      <path d="M 165,397 C 275,412 345,362 345,287 C 345,232 295,207 235,192 L 250,227 C 290,242 315,262 315,292 C 315,337 270,372 180,362 Z"
            fill="url(#lowerGlassGrad)" />

      <!-- LOWER RIBBON FACET ACCENT -->
      <path d="M 165,397 C 270,407 330,367 335,302 C 320,347 265,377 165,372 Z"
            fill="url(#lowerFacetGrad)" />

      <!-- CENTRAL CORAL REFRACTIVE SEAM -->
      <!-- The focal junction where Sound meets Sentence -->
      <path d="M 235,192 C 265,210 285,245 275,320 C 260,285 245,250 215,220 Z"
            fill="url(#coralSeamGrad)" />

      <!-- DELICATE SPECULAR EDGE HIGHLIGHTS -->
      <path d="M 330,118 C 245,108 175,150 170,215" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 180,394 C 265,404 335,362 340,297" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
      <circle cx="255" cy="256" r="3" fill="#FFFFFF" opacity="0.9" />
    </g>
</svg>