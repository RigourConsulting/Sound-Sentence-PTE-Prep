<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160">
  <defs>
    <linearGradient id="wmGlassGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E8F1F5" />
      <stop offset="50%" stop-color="#C9D9E4" />
      <stop offset="100%" stop-color="#8BA5B5" />
    </linearGradient>
    <linearGradient id="wmCoralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F08D7A" />
      <stop offset="100%" stop-color="#B94836" />
    </linearGradient>
  </defs>

  <!-- Scaled Cut-Glass S Emblem (centered at x=80, y=80, scale=0.28) -->
  <g transform="translate(10, 10) scale(0.273)">
    <!-- Upper Ribbon -->
    <path d="M 345,115 C 235,100 165,150 165,225 C 165,280 215,305 275,320 L 260,285 C 220,270 195,250 195,220 C 195,175 240,140 330,150 Z"
          fill="url(#wmGlassGrad)" stroke="#30253F" stroke-width="3" />
    <!-- Lower Ribbon -->
    <path d="M 165,397 C 275,412 345,362 345,287 C 345,232 295,207 235,192 L 250,227 C 290,242 315,262 315,292 C 315,337 270,372 180,362 Z"
          fill="url(#wmGlassGrad)" stroke="#30253F" stroke-width="3" />
    <!-- Coral Seam -->
    <path d="M 235,192 C 265,210 285,245 275,320 C 260,285 245,250 215,220 Z"
          fill="url(#wmCoralGrad)" />
    <!-- Highlights -->
    <path d="M 330,118 C 245,108 175,150 170,215" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 180,394 C 265,404 335,362 340,297" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <!-- Primary Wordmark: Sound & Sentence -->
  <text x="175" y="96" font-family="'Newsreader', 'Georgia', 'Playfair Display', serif" font-size="44" font-weight="600" fill="#30253F" letter-spacing="-0.5">Sound &amp; Sentence</text>

  <!-- Brand Separator in Coral -->
  <line x1="625" y1="56" x2="625" y2="104" stroke="#B94836" stroke-width="3.5" stroke-linecap="round" />

  <!-- Descriptor: PTE Prep -->
  <text x="645" y="96" font-family="'Source Sans 3', 'Segoe UI', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#B94836" letter-spacing="1.2">PTE Prep</text>
</svg>